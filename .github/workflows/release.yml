name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 1.2.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Read Swift version
        run: echo "SWIFT_VERSION=$(cat .swift-version)" >> $GITHUB_ENV

      - name: Select Xcode for Swift version
        run: |
          CANDIDATES=(/Applications/Xcode_*.app /Applications/Xcode.app)
          FOUND=""
          for XCODE_PATH in "${CANDIDATES[@]}"; do
            if [ -d "$XCODE_PATH" ]; then
              ACTUAL_VERSION=$(DEVELOPER_DIR="$XCODE_PATH/Contents/Developer" xcrun swift --version | awk '/Apple Swift version/ {print $4}')
              if [ "$ACTUAL_VERSION" = "${{ env.SWIFT_VERSION }}" ]; then
                sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
                FOUND="$XCODE_PATH"
                break
              fi
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::Swift version ${{ env.SWIFT_VERSION }} not found on runner"
            for XCODE_PATH in "${CANDIDATES[@]}"; do
              if [ -d "$XCODE_PATH" ]; then
                ACTUAL_VERSION=$(DEVELOPER_DIR="$XCODE_PATH/Contents/Developer" xcrun swift --version | awk '/Apple Swift version/ {print $4}')
                echo "Found Xcode: $XCODE_PATH (Swift $ACTUAL_VERSION)"
              fi
            done
            exit 1
          fi
          xcrun swift --version

      - name: Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Validate Release Version
        run: |
          RELEASE_VERSION="${{ steps.version.outputs.version }}"
          REPOSITORY_VERSION=$(tr -d '[:space:]' < VERSION)
          if [ "$RELEASE_VERSION" != "$REPOSITORY_VERSION" ]; then
            echo "Release version $RELEASE_VERSION does not match VERSION ($REPOSITORY_VERSION)"
            exit 1
          fi
          if ! grep -Fq "## [$RELEASE_VERSION]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $RELEASE_VERSION"
            exit 1
          fi

      - name: Build App Bundle
        run: ./build.sh

      - name: Update Version in Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" Weakup.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Weakup.app/Contents/Info.plist

      - name: Import Code Signing Certificate
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Set keychain search list
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Allow codesign to access the certificate
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Code Sign App
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          # Find the signing identity
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')

          if [ -n "$IDENTITY" ]; then
            echo "Signing with: $IDENTITY"

            # Sign the binary
            codesign --force --options runtime --timestamp \
              --sign "$IDENTITY" \
              --entitlements Sources/Weakup/Weakup.entitlements \
              Weakup.app/Contents/MacOS/weakup

            # Sign the app bundle
            codesign --force --options runtime --timestamp \
              --sign "$IDENTITY" \
              --entitlements Sources/Weakup/Weakup.entitlements \
              Weakup.app

            # Verify
            codesign --verify --verbose=2 Weakup.app
          else
            echo "No signing identity found, skipping code signing"
          fi

      - name: Notarize App
        if: ${{ env.APPLE_ID != '' && env.APPLE_PASSWORD != '' && env.APPLE_TEAM_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Create ZIP for notarization
          ditto -c -k --keepParent Weakup.app Weakup-notarize.zip

          # Submit for notarization
          xcrun notarytool submit Weakup-notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # Staple the ticket
          xcrun stapler staple Weakup.app

          # Clean up
          rm -f Weakup-notarize.zip

      - name: Verify Notarization
        if: ${{ env.APPLE_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          xcrun stapler validate Weakup.app || echo "Notarization verification skipped"

      - name: Create DMG
        run: |
          mkdir -p dmg-contents
          cp -R Weakup.app dmg-contents/
          ln -s /Applications dmg-contents/Applications
          hdiutil create -volname "Weakup" -srcfolder dmg-contents -ov -format UDZO Weakup-${{ steps.version.outputs.version }}.dmg

      - name: Notarize DMG
        if: ${{ env.APPLE_ID != '' && env.APPLE_PASSWORD != '' && env.APPLE_TEAM_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="Weakup-${{ steps.version.outputs.version }}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Create ZIP
        run: |
          ditto -c -k --sequesterRsrc --keepParent Weakup.app Weakup-${{ steps.version.outputs.version }}.zip

      - name: Package Source Code
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git archive \
            --format=tar.gz \
            --prefix="Weakup-${VERSION}/" \
            --output="Weakup-${VERSION}-source.tar.gz" \
            "$GITHUB_SHA"

      - name: Check Prebuilt Distribution Readiness
        id: distribution
        run: |
          if codesign -dv --verbose=4 Weakup.app 2>&1 | grep -q "Authority=Developer ID Application" && \
             xcrun stapler validate Weakup.app >/dev/null 2>&1 && \
             xcrun stapler validate "Weakup-${{ steps.version.outputs.version }}.dmg" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Signed and notarized prebuilt artifacts will be published."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Prebuilt artifacts are not distribution-ready; only source code will be published."
          fi

      - name: Generate Checksums
        run: |
          shasum -a 256 Weakup-${{ steps.version.outputs.version }}-source.tar.gz > checksums.txt
          if [ "${{ steps.distribution.outputs.ready }}" = "true" ]; then
            shasum -a 256 Weakup-${{ steps.version.outputs.version }}.dmg >> checksums.txt
            shasum -a 256 Weakup-${{ steps.version.outputs.version }}.zip >> checksums.txt
          fi
          cat checksums.txt

      - name: Extract Release Notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract release notes for this version from CHANGELOG.md
          # Look for ## [version] or ## [Unreleased] section
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]" || ($0 ~ "\\[Unreleased\\]" && ver == "")) {
                found = 1
                next
              }
            }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "No release notes found for $VERSION"
            exit 1
          fi

          # Write to file for use in release body
          echo "$NOTES" > release_notes.md

          # Also output for debugging
          echo "Release notes:"
          cat release_notes.md

      - name: Generate Release Body
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if [ "${{ steps.distribution.outputs.ready }}" = "true" ]; then
            ARCHITECTURES=$(lipo -archs Weakup.app/Contents/MacOS/weakup)
            cat > prebuilt_status.md << EOF
          ### Signed Prebuilt Downloads

          This release is signed with Apple Developer ID and notarized by Apple.

          **Architecture:** \`${ARCHITECTURES}\`

          - DMG: download \`Weakup-${VERSION}.dmg\`, then drag Weakup to Applications.
          - ZIP: download \`Weakup-${VERSION}.zip\`, extract it, then move Weakup.app to Applications.
          EOF
          else
            cat > prebuilt_status.md << EOF
          ### Prebuilt Downloads

          No supported prebuilt download is available for this release. Unsigned DMG and ZIP build artifacts are not published because they cannot pass normal macOS distribution checks.
          EOF
          fi

          cat > release_body.md << EOF
          ## Weakup v${VERSION}

          $(cat release_notes.md)

          ---

          ### Installation

          **Source Code (Supported)**
          1. Download \`Weakup-${VERSION}-source.tar.gz\`
          2. Extract it and follow the source build instructions in README.md

          $(cat prebuilt_status.md)

          ### Requirements
          - Source build: macOS 13.0 or later, Xcode, and the minimum Swift version specified in \`.swift-version\` (or later)

          Weakup is not currently available from the official Homebrew Cask repository.

          ### Checksums (SHA-256)
          \`\`\`text
          $(cat checksums.txt)
          \`\`\`
          EOF

          cat release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Weakup v${{ steps.version.outputs.version }}
          body_path: release_body.md
          files: |
            Weakup-${{ steps.version.outputs.version }}-source.tar.gz
            checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Signed Prebuilt Artifacts
        if: ${{ steps.distribution.outputs.ready == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Weakup-${{ steps.version.outputs.version }}.dmg
            Weakup-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
